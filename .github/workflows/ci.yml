# Every push to master and every pull request: backend tests, frontend build, Docker image build
# (amd64 and arm64 on master, so a tag never finds an arm64 problem first; amd64 on pull requests).
# A version tag (vX.Y.Z, see docs/release.md) also publishes the image to ghcr.io/altzone/switchpilot
# for amd64 and arm64, then the GitHub release with the CHANGELOG.md section as its notes.
name: CI

on:
  push:
    branches: [master]
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  IMAGE: ghcr.io/altzone/switchpilot

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Backend tests
        working-directory: backend
        run: |
          python -m pip install -r requirements.txt pytest pytest-asyncio
          python -m pytest -q tests
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: The tag is the version in the code
        if: github.ref_type == 'tag'
        run: |
          code=$(cd backend && python -c 'from version import VERSION; print(VERSION)')
          if [ "${GITHUB_REF_NAME#v}" != "$code" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but backend/version.py says $code"
            exit 1
          fi

  image:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      latest: ${{ steps.moving.outputs.latest }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # every tag: the moving image tags only follow the newest version
      - name: Moving tags this version takes
        id: moving
        if: github.ref_type == 'tag'
        run: python3 .github/scripts/moving_tags.py "$GITHUB_REF_NAME" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v4
        if: github.event_name == 'push'
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: A published version is never replaced
        if: github.ref_type == 'tag'
        run: |
          if docker buildx imagetools inspect "$IMAGE:${GITHUB_REF_NAME#v}" > /dev/null 2>&1; then
            echo "::error::$IMAGE:${GITHUB_REF_NAME#v} is already published"
            exit 1
          fi
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          labels: |
            org.opencontainers.image.title=SwitchPilot
            org.opencontainers.image.description=Web management for Xikestor SKS3200-8E2X switches
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.moving.outputs.minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.moving.outputs.major == 'true' }}
            type=raw,value=latest,enable=${{ steps.moving.outputs.latest == 'true' }}
            type=ref,event=branch
            type=ref,event=pr
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ github.event_name == 'push' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Release notes from CHANGELOG.md
        run: python3 .github/scripts/release_notes.py "${GITHUB_REF_NAME#v}" > notes.md
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ needs.image.outputs.latest }}  # a fix for an older line is not the latest release
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --latest="$LATEST" --title "SwitchPilot ${GITHUB_REF_NAME#v}" --notes-file notes.md
