[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0

; Stop order: supervisord stops one program at a time, highest priority number first. The backend
; goes first: its live streams end at once, requests still running get 100 s, and changes still
; being sent to a switch get up to 20 s more (main.py, SWITCH_CHANGES_GRACE); their answers go out
; through nginx, which stops last. stopwaitsecs of both (130 + 15) stays under the container's
; stop_grace_period (150 s, docker-compose.yml).
[program:backend]
command=uvicorn main:app --host 127.0.0.1 --port 8000 --timeout-graceful-shutdown 100
directory=/app/backend
priority=20
autostart=true
autorestart=true
stopwaitsecs=130
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=10
autostart=true
autorestart=true
; graceful stop: answers still on their way are delivered
stopsignal=QUIT
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
