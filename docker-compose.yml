services:
  switchpilot:
    build: .
    container_name: switchpilot
    restart: unless-stopped
    # time to finish a change being sent to a switch when the container stops (usually 1-2 s)
    stop_grace_period: 150s
    labels:
      # updated when you choose to, not by a Watchtower that updates every container
      com.centurylinklabs.watchtower.enable: "false"
    ports:
      - "8880:80"
    volumes:
      - ./data:/app/data
    environment:
      - DB_PATH=/app/data/switchpilot.db
      # Session signing key. Leave unset: a random key is generated on first start and kept
      # in ./data/secret_key. Set your own only if you run several replicas.
      # - SECRET_KEY=
      # Behind a reverse proxy: its address(es), so login throttling sees the real client
      # address from X-Forwarded-For instead of the proxy's.
      # - TRUSTED_PROXIES=172.17.0.1,10.0.0.0/8
